<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHO ỨNG DỤNG XIAOMI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef6ff;
    color:#17324d;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0757c9,#1685e8);
    padding:32px 20px 28px;
    text-align:center;
    color:white;
}

.header h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:.5px;
}

.header p{
    margin-top:10px;
    font-size:17px;
    opacity:.95;
}

.phone{
    margin-top:7px;
    font-size:18px;
    font-weight:700;
}

/* MENU */

.menu{
    max-width:1200px;
    margin:22px auto;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.menu button{
    border:1px solid #c9def5;
    background:white;
    color:#155ba5;
    padding:12px 19px;
    border-radius:25px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.menu button:hover,
.menu button.active{
    background:#126bd0;
    color:white;
    border-color:#126bd0;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:0 auto;
    padding:5px 20px 50px;
}

/* TITLE */

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0 18px;
}

.section-title .line{
    width:5px;
    height:30px;
    background:#1172d1;
    border-radius:5px;
}

.section-title h2{
    font-size:25px;
    color:#075bb5;
}

/* SEARCH */

.search-box{
    margin-bottom:22px;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    border:1px solid #c8dcf2;
    border-radius:14px;
    outline:none;
    font-size:16px;
    background:white;
}

.search-box input:focus{
    border-color:#1675d1;
    box-shadow:0 0 0 3px rgba(22,117,209,.10);
}

/* APP GRID */

.apps{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

/* APP CARD */

.app-card{
    background:white;
    border:1px solid #d9e8f7;
    border-radius:18px;
    padding:24px;
    text-align:center;
    box-shadow:0 5px 18px rgba(20,83,140,.07);
    transition:.2s;
}

.app-card:hover{
    transform:translateY(-3px);
    box-shadow:0 9px 25px rgba(20,83,140,.12);
}

.app-icon{
    width:92px;
    height:92px;
    object-fit:contain;
    border-radius:20px;
    margin-bottom:12px;
}

.app-name{
    font-size:20px;
    font-weight:800;
    color:#163b60;
    margin-bottom:16px;
}

.download-btn{
    display:block;
    width:100%;
    padding:13px 15px;
    border:none;
    border-radius:12px;
    background:#1172d1;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.download-btn:hover{
    background:#075bb5;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:25px 15px;
    background:#0757c9;
    color:white;
    font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

    .header h1{
        font-size:27px;
    }

    .header p{
        font-size:15px;
    }

    .menu{
        padding:0 12px;
    }

    .menu button{
        font-size:14px;
        padding:10px 14px;
    }

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .apps{
        grid-template-columns:1fr;
    }

    .app-card{
        padding:20px;
    }

}

</style>
</head>

<body>

<header class="header">

    <h1>📺 KHO ỨNG DỤNG XIAOMI</h1>

    <p>
        Hỗ trợ các lỗi về tivi Xiaomi - cài đặt tiếng Việt
    </p>

    <div class="phone">
        ☎ 0379750874
    </div>

</header>


<nav class="menu">

    <button class="active" onclick="showCategory('all',this)">
        🏠 Tất cả
    </button>

    <button onclick="showCategory('truyen-hinh',this)">
        📺 Truyền hình
    </button>

    <button onclick="showCategory('nha-dai',this)">
        📡 Nhà Đài
    </button>

    <button onclick="showCategory('giai-tri',this)">
        🎬 Giải trí
    </button>

    <button onclick="showCategory('kho-ung-dung',this)">
        📦 Kho ứng dụng
    </button>

    <button onclick="showCategory('du-phong',this)">
        🛠️ Ứng dụng dự phòng
    </button>

</nav>


<main class="container">

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔎 Tìm kiếm ứng dụng..."
            oninput="searchApps()"
        >

    </div>


    <div class="section-title">

        <div class="line"></div>

        <h2 id="sectionName">
            Ứng dụng mới
        </h2>

    </div>


    <div class="apps" id="appList">

        <!-- Ứng dụng sẽ được đưa vào đây -->

        <div class="app-card">

            <div class="app-icon"
                 style="
                 width:92px;
                 height:92px;
                 margin:0 auto 12px;
                 background:#eaf3ff;
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 font-size:40px;
                 ">
                📺
            </div>

            <div class="app-name">
                Đang cập nhật ứng dụng
            </div>

            <div style="
                color:#71869b;
                font-size:14px;
                margin-bottom:16px;
            ">
                Kho ứng dụng Xiaomi
            </div>

            <button class="download-btn" disabled
                style="opacity:.6;">
                Đang cập nhật
            </button>

        </div>

    </div>

</main>


<footer class="footer">

    KHO ỨNG DỤNG XIAOMI
    <br>
    Hỗ trợ cài đặt tiếng Việt & xử lý lỗi tivi Xiaomi
    <br>
    0379750874

</footer>


<script>

function showCategory(category,button){

    document.querySelectorAll('.menu button')
        .forEach(btn => btn.classList.remove('active'));

    button.classList.add('active');

    const title = document.getElementById('sectionName');

    const names = {

        'all':'Ứng dụng mới',

        'truyen-hinh':'📺 Truyền hình',

        'nha-dai':'📡 Nhà Đài',

        'giai-tri':'🎬 Giải trí',

        'kho-ung-dung':'📦 Kho ứng dụng',

        'du-phong':'🛠️ Ứng dụng dự phòng'

    };

    title.textContent = names[category];

    const cards = document.querySelectorAll('.app-card');

    cards.forEach(card => {

        const cardCategory = card.dataset.category;

        if(category === 'all' || cardCategory === category){
            card.style.display = '';
        }else{
            card.style.display = 'none';
        }

    });

}


function searchApps(){

    const keyword =
        document.getElementById('search')
        .value
        .toLowerCase();

    const cards =
        document.querySelectorAll('.app-card');

    cards.forEach(card => {

        const text =
            card.textContent.toLowerCase();

        if(text.includes(keyword)){
            card.style.display='';
        }else{
            card.style.display='none';
        }

    });

}

</script>

</body>
</html>
