<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHO ỨNG DỤNG XIAOMI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef6ff;
    color: #172033;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #0757c9, #168cf5);
    color: white;
    text-align: center;
    padding: 34px 20px 30px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 10px;
    font-size: 18px;
}

.phone {
    margin-top: 8px;
    font-size: 21px;
    font-weight: bold;
}

/* DANH MỤC */
.category-area {
    max-width: 1450px;
    margin: auto;
    padding: 25px 25px 10px;
}

.categories {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.category {
    border: 2px solid #c9e2fa;
    background: white;
    color: #125aa8;
    border-radius: 30px;
    padding: 13px 22px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
}

.category.active {
    background: #0b6edb;
    color: white;
    border-color: #0b6edb;
}

/* TÌM KIẾM */
.search-area {
    max-width: 850px;
    margin: 20px auto 28px;
    padding: 0 20px;
}

.search-box {
    width: 100%;
    height: 54px;
    padding: 0 24px;
    border: 2px solid #c8e1fa;
    border-radius: 30px;
    background: white;
    font-size: 18px;
    outline: none;
}

.search-box:focus {
    border-color: #168cf5;
}

/* NỘI DUNG */
.content {
    max-width: 1450px;
    margin: auto;
    padding: 0 25px 55px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #0757c9;
    font-size: 28px;
    font-weight: 800;
    margin: 8px 0 20px;
}

/* APP */
.apps {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.app-card {
    background: white;
    border: 1px solid #d6e8f9;
    border-radius: 18px;
    padding: 25px;
    min-height: 245px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(20, 90, 160, 0.08);
}

.app-icon {
    width: 90px;
    height: 90px;
    object-fit: contain;
    margin-bottom: 10px;
}

.app-name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 18px;
}

.download-button {
    display: inline-block;
    min-width: 190px;
    padding: 13px 30px;
    border-radius: 10px;
    background: #0b6edb;
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 700;
}

.download-button:hover {
    background: #0757b5;
}

/* THÔNG BÁO */
.notice {
    background: white;
    border-left: 5px solid #168cf5;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 25px;
    color: #425466;
    font-size: 16px;
}

/* FOOTER */
.footer {
    background: #0757c9;
    color: white;
    text-align: center;
    padding: 25px;
    font-size: 15px;
}

/* MÀN HÌNH NHỎ */
@media (max-width: 800px) {
    .header h1 {
        font-size: 29px;
    }

    .apps {
        grid-template-columns: 1fr;
    }

    .category {
        font-size: 15px;
        padding: 11px 16px;
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>KHO ỨNG DỤNG XIAOMI</h1>

    <div class="subtitle">
        Hỗ trợ các lỗi về tivi Xiaomi - cài đặt tiếng Việt
    </div>

    <div class="phone">
        ☎ 0379750874
    </div>

</header>


<section class="category-area">

    <div class="categories">

        <button class="category active">
            📺 Truyền hình
        </button>

        <button class="category">
            📡 Nhà Đài
        </button>

        <button class="category">
            🎬 Giải trí
        </button>

        <button class="category">
            🧰 Kho ứng dụng
        </button>

        <button class="category">
            💾 Ứng dụng dự phòng
        </button>

    </div>

</section>


<div class="search-area">

    <input
        class="search-box"
        type="text"
        placeholder="🔎  Tìm kiếm ứng dụng..."
    >

</div>


<main class="content">

    <div class="notice">
        📌 Kho ứng dụng dành cho TV Xiaomi và Android TV.
        Các ứng dụng sẽ được cập nhật thường xuyên.
    </div>

    <div class="section-title">
        📺 Truyền hình
    </div>

    <div class="apps">

        <div class="app-card">

            <div style="font-size:70px;">
                📺
            </div>

            <div class="app-name">
                Ứng dụng đang cập nhật
            </div>

            <a class="download-button" href="#">
                Tải về
            </a>

        </div>

        <div class="app-card">

            <div style="font-size:70px;">
                📺
            </div>

            <div class="app-name">
                Sắp có ứng dụng
            </div>

            <a class="download-button" href="#">
                Tải về
            </a>

        </div>

    </div>

</main>


<footer class="footer">

    KHO ỨNG DỤNG XIAOMI • Hỗ trợ kỹ thuật: 0379750874

</footer>

</body>
</html>
